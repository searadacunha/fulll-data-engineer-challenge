[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "junior-data-transformation-and-analysis-evaluation"
version = "1.0.0"
authors = [
    {name = "fulll", email = "developer@fulll.fr"},
    {name = "Benjamin Da Cunha"},
]
description = "Data Engineer Junior: data transformation and analysis evaluation"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
    "Operating System :: OS Independent",
]

# numpy is no longer listed: the program does not import it, pandas pulls in a
# compatible release and uv.lock records the exact one. The lower bound is the
# oldest pandas line the tests run on (uv.lock: 3.1.1).
dependencies = [
  "pandas>=3.1,<4",
]

[dependency-groups]
dev = [
  "hypothesis>=6.170",
  "pytest>=9",
  "ruff>=0.17",
]

[tool.setuptools]
# Flat layout with two top-level modules: name the one that is the program.
py-modules = ["bike_investigation"]

[tool.pytest]
testpaths = ["test_bike_investigation.py", "tests"]
strict = true  # strict config, markers, xfail and parametrization ids (pytest 9)
addopts = ["-ra"]
markers = [
  "realdata: needs the official CSV files (python scripts/fetch_data.py)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PT", "PD", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The official test file stays a unittest.TestCase, as provided.
"test_bike_investigation.py" = ["PT"]